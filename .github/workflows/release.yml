name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix
        required: true
        default: "3.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Package Bandwagon.app
        env:
          BANDWAGON_CI_RELEASE: "1"
          BANDWAGON_SIGNING_IDENTITY: "-"
          BANDWAGON_APP_OUTPUT: ${{ runner.temp }}/Bandwagon/Bandwagon.app
        run: |
          mkdir -p "$(dirname "$BANDWAGON_APP_OUTPUT")"
          ./scripts/package-app.sh
          ./scripts/verify-credential-bridge.sh "$BANDWAGON_APP_OUTPUT/Contents/Resources/BandwagonCredentialBridge"

      - name: Create zip and DMG
        id: artifacts
        env:
          BANDWAGON_APP_OUTPUT: ${{ runner.temp }}/Bandwagon/Bandwagon.app
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          ZIP="${{ runner.temp }}/Bandwagon-${VERSION}-macOS.zip"
          DMG="${{ runner.temp }}/Bandwagon-${VERSION}-macOS.dmg"
          ditto -c -k --keepParent "$BANDWAGON_APP_OUTPUT" "$ZIP"
          bash ./scripts/package-dmg.sh "$BANDWAGON_APP_OUTPUT" "$DMG"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Bandwagon ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.dmg }}
          body: |
            macOS 15+，Apple Silicon（`arm64`）构建。

            **推荐**：下载 `Bandwagon-*-macOS.dmg`，打开后把 Bandwagon 拖到「应用程序」文件夹。

            也可使用 zip 解压后手动安装。首次若被拦截：右键应用 → **打开**（临时签名，未经公证）。首次运行后在设置里填写 VEID、API Key 与 3X-UI 信息。
